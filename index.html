<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Правда или Действие</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1a1e2c 0%, #2a2f44 100%);
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        /* главный контейнер */
        .game {
            max-width: 700px;
            width: 100%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(3px);
            border-radius: 2.5rem;
            padding: 1.2rem;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4);
        }

        .card {
            background: #fffaf2;
            border-radius: 2rem;
            padding: 1.8rem;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
        }

        h1 {
            font-size: 2.4rem;
            background: linear-gradient(135deg, #e64848, #f9a826);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .sub {
            color: #4a4e69;
            font-weight: 500;
            margin-bottom: 1.8rem;
            border-bottom: 2px dotted #ffb347;
            display: inline-block;
            padding-bottom: 5px;
        }

        /* блок результата с анимацией */
        .result-box {
            background: #ffffff;
            border-radius: 1.8rem;
            padding: 1.8rem 1rem;
            margin: 1.5rem 0;
            min-height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03), 0 10px 20px rgba(0,0,0,0.1);
            transition: box-shadow 0.2s;
        }

        .result-text {
            font-size: 1.5rem;
            line-height: 1.4;
            font-weight: 500;
            color: #1e2a3e;
            word-break: break-word;
            transition: opacity 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.2s ease;
            opacity: 1;
            transform: scale(1);
        }

        .result-text.fade-out {
            opacity: 0;
            transform: scale(0.96);
        }

        .badge {
            display: inline-block;
            background: #2c3e66;
            color: white;
            border-radius: 40px;
            padding: 0.25rem 1.2rem;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.9rem;
            letter-spacing: 1px;
        }

        /* кнопки — компактные и красивые */
        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.9rem;
            justify-content: center;
            margin: 1rem 0 0.5rem;
        }

        .btn {
            flex: 1;
            min-width: 115px;
            padding: 0.9rem 0.5rem;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 3rem;
            cursor: pointer;
            transition: all 0.15s linear;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: #ececec;
            color: #1f2937;
            box-shadow: 0 5px 0 #b0b0b0;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b0b0b0;
        }

        .truth {
            background: #3b82f6;
            color: white;
            box-shadow: 0 5px 0 #1e40af;
        }
        .dare {
            background: #ef4444;
            color: white;
            box-shadow: 0 5px 0 #991b1b;
        }
        .random {
            background: #f97316;
            color: white;
            box-shadow: 0 5px 0 #c2410c;
        }

        /* пульсация при клике */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(0.97); }
            100% { transform: scale(1); }
        }
        .btn:active {
            animation: pulse 0.2s ease;
        }

        footer {
            font-size: 0.75rem;
            color: #d1d5db;
            margin-top: 1.5rem;
            text-align: center;
            background: rgba(0,0,0,0.2);
            border-radius: 2rem;
            padding: 0.5rem;
        }

        @media (max-width: 550px) {
            .card { padding: 1.2rem; }
            .result-text { font-size: 1.25rem; }
            .btn { min-width: 100px; font-size: 1rem; padding: 0.7rem 0.3rem; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
<div class="game">
    <div class="card">
        <h1>🎲 ПРАВДА / ДЕЙСТВИЕ</h1>
        <div class="sub">Выбери или доверься случаю</div>

        <div class="result-box">
            <div class="result-text" id="resultDisplay">
                👋 Нажми на кнопку<br> и получи вызов!
            </div>
        </div>

        <div class="buttons">
            <button class="btn truth" data-type="truth">❓ ПРАВДА</button>
            <button class="btn dare" data-type="dare">⚡ ДЕЙСТВИЕ</button>
            <button class="btn random" data-type="random">🎲 РАНДОМ</button>
        </div>
        <footer>50 вопросов и 50 заданий · Играйте честно</footer>
    </div>
</div>

<script>
    // ---------- 50 ВОПРОСОВ (правда) ----------
    const truthList = [

        "Кому из присутствующих ты доверяешь меньше всего?",
        "Ты когда-нибудь врал, чтобы казаться лучше?",
        "Какой поступок тебе больше всего стыдно?",
        "Кто тебе тайно нравится из присутствующих?",
        "Что бы ты сделал, если бы остался один на необитаемом острове?",
        "Какую сумму ты готов отдать за исполнение заветного желания?",
        "Ты когда-нибудь подсматривал за кем-то?",
        "Какой самый глупый слух ты слышал о себе?",
        "Что бы ты изменил в своей внешности?",
        "Твоя самая большая слабость?",
        "Когда ты последний раз плакал?",
        "Ты веришь в любовь с первого взгляда?",
        "Что ты делаешь, когда остаёшься один дома?",
        "Какую тайну ты никому не рассказывал?",
        "Ты когда-нибудь воровал?",
        "Что ты думаешь о человеке справа от тебя?",
        "Какое твоё самое дорогое материальное желание?",
        "Ты бы смог ударить друга?",
        "Какой фильм заставил тебя прослезиться?",
        "Ты ревнивый?",
        "Что ты ненавидишь в людях больше всего?",
        "Какая твоя привычка бесит других?",
        "Ты когда-нибудь притворялся больным?",
        "Какой твой самый дикий поступок?",
        "Что бы ты сделал, если бы выиграл миллион?",
        "Ты когда-нибудь целовался с кем-то из присутствующих?",
        "Какое качество ты ценишь в друзьях?",
        "Что тебя заводит (нематериальное)?",
        "Ты бы смог убить человека ради спасения другого?",
        "Какой вопрос ты боишься услышать?",
        "Ты когда-нибудь обманывал в играх?",
        "Что бы ты хотел успеть сделать до конца жизни?",
        "Какая у тебя самая странная фантазия?",
        "Ты завидуешь кому-то из друзей?",
        "Какую музыку ты слушаешь в тайне от всех?",
        "Что ты делаешь в душе, кроме мытья?",
        "Какая твоя самая низкая оценка в школе была?",
        "Ты когда-нибудь подкалывал друга за его спиной?",
        "Что для тебя важнее: любовь или дружба?",
        "Какой комплимент ты говорил неискренне?",
        "Ты берёшь чужие вещи без спроса?",
        "Что тебя пугает больше всего?",
        "Ты бы пошёл на свидание с незнакомцем?",
        "Какую ложь ты говорил родителям?",
        "Ты веришь в судьбу?",
        "Что ты думаешь о политике?",
        "Как часто ты моешь руки?",
        "Какую сумму ты готов заплатить за чужой секрет?",
        "Какая самая отвратительная еда, которую ты пробовал?"
    ];

    // ---------- 50 ДЕЙСТВИЙ ----------
    const actionList = [
        "Съешь ложку соли или сахара (на выбор).",
        "Изобрази любое животное, чтобы остальные угадали.",
        "Сделай селфи с каждым игроком.",
        "Расскажи анекдот.",
        "Протанцуй под любую песню 20 секунд.",
        "Обменяйся предметом одежды с соседом (например, носками).",
        "Напиши на лбу слово «Гений».",
        "Позвони первому контакту в телефоне и скажи, что любишь его/её.",
        "Сделай массаж плеч соседу.",
        "Спой куплет из любой песни.",
        "Изобрази известного человека, чтобы угадали.",
        "Съешь что-то острое (соус, перец, чеснок).",
        "Признайся в любви стене.",
        "Сделай 10 отжиманий.",
        "Говори одну минуту с иностранным акцентом.",
        "Нарисуй на листе что‑то с закрытыми глазами.",
        "Дай другому игроку помазать твоё лицо йогуртом или вареньем.",
        "Покажи пантомиму «человек играет в теннис».",
        "Спроси у любого прохожего (или по видео‑звонку) «Который час?» странным голосом.",
        "Сделай комплимент каждому игроку.",
        "Изобрази, как плачет младенец.",
        "Попрыгай на одной ноге по комнате.",
        "Расскажи стишок или отрывок из рэпа.",
        "Выпей стакан воды за 5 секунд.",
        "Напиши на руке что‑то смешное.",
        "Поцелуй свою руку и помаши.",
        "Изобрази ветряную мельницу руками.",
        "Сложи из предметов на столе букву «X» (или любую другую).",
        "Покажи, как чихает старик.",
        "Сделай фото своей пятки.",
        "Шепни секрет на ухо соседу.",
        "Положи в рот конфету и скажи скороговорку.",
        "Изобрази робота.",
        "Сделай страшное лицо в камеру.",
        "Сними один носок и походи по комнате.",
        "Дай себя обнять каждому игроку.",
        "Скажи «Я очаровашка» 5 раз с разной интонацией.",
        "Подними обе руки вверх и замри на 10 секунд.",
        "Сочини четверостишие о любом присутствующем.",
        "Укуси свой локоть (хотя бы изобрази попытку).",
        "Покажи, как ты красишь губы невидимой помадой.",
        "Присядь 20 раз.",
        "Напиши на стикере слово «Азохенвей» и приклей на лоб.",
        "Изобрази кактус.",
        "Покажи сценку «я в метро в час пик».",
        "Скажи «Ку-ку» как кукушка.",
        "Поменяйся с кем-то обувью на один раунд.",
        "Надуй щёки и хлопни по ним.",
        "Подойди к зеркалу и сделай гримасу.",
        "Скажи тост «За эту замечательную компанию!»."
    ];

    // DOM элементы
    const resultEl = document.getElementById('resultDisplay');
    let fadeTimer = null;

    // случайный элемент массива
    const randomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];

    // универсальная функция показа с плавным исчезновением
    function showWithType(type) {
        // очистить старый таймер, чтобы не пересекался
        if (fadeTimer) clearTimeout(fadeTimer);

        // начинаем анимацию исчезновения
        resultEl.classList.add('fade-out');

        // после короткой паузы меняем текст и убираем класс
        fadeTimer = setTimeout(() => {
            let badgeText = '';
            let content = '';

            if (type === 'truth') {
                badgeText = '❓ ПРАВДА';
                content = randomItem(truthList);
            } 
            else if (type === 'dare') {
                badgeText = '⚡ ДЕЙСТВИЕ';
                content = randomItem(actionList);
            } 
            else { // random
                const isTruth = Math.random() < 0.5;
                if (isTruth) {
                    badgeText = '🎲 РАНДОМ → ПРАВДА';
                    content = randomItem(truthList);
                } else {
                    badgeText = '🎲 РАНДОМ → ДЕЙСТВИЕ';
                    content = randomItem(actionList);
                }
            }

            resultEl.innerHTML = `<span class="badge">${badgeText}</span><br>${content}`;
            resultEl.classList.remove('fade-out');
            fadeTimer = null;
        }, 150);
    }

    // назначаем обработчики на все кнопки через делегирование (чище)
    document.querySelectorAll('.btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const type = btn.getAttribute('data-type');
            if (type === 'truth') showWithType('truth');
            else if (type === 'dare') showWithType('dare');
            else if (type === 'random') showWithType('random');
        });
    });

    // лёгкий эффект при загрузке (необязательно)
    console.log('Игра готова | правда/действие для Telegram');
</script>
</body>
</html>
