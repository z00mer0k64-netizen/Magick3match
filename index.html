<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Правда или Действие — 18+</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* чтобы текст не выделялся при частом нажатии */
        }

        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border-radius: 64px;
            padding: 20px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .card {
            background: #0f0f1f;
            border-radius: 48px;
            padding: 30px 24px;
            text-align: center;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5), 0 15px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,105,180,0.3);
            transition: all 0.2s ease;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .sub {
            color: #b9b9d9;
            font-size: 0.9rem;
            margin-bottom: 28px;
            border-bottom: 1px dashed #ff69b4;
            display: inline-block;
            padding-bottom: 6px;
        }

        .question-box {
            background: #010118;
            border-radius: 48px;
            padding: 30px 20px;
            margin: 20px 0 30px;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ff69b4;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .question-text {
            font-size: 1.5rem;
            line-height: 1.4;
            color: #f8f4e9;
            font-weight: 500;
            word-break: break-word;
            text-shadow: 0 1px 2px black;
            transition: 0.1s linear;
        }

        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            border: none;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 14px 32px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            background: #2d2d44;
            color: white;
            box-shadow: 0 5px 0 #0b0b15;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0b0b15;
        }

        .btn-truth {
            background: #b34180;
            background: linear-gradient(135deg, #c94f8c, #b12a6b);
            box-shadow: 0 5px 0 #6b1a42;
        }

        .btn-dare {
            background: #3c6e71;
            background: linear-gradient(135deg, #2c7a47, #1d5a3e);
            box-shadow: 0 5px 0 #0e3a22;
        }

        .btn-reset {
            background: #3a2c4a;
            background: linear-gradient(135deg, #4a3b5e, #2f2340);
            box-shadow: 0 4px 0 #1d152b;
            font-size: 1rem;
            padding: 10px 24px;
        }

        .footer {
            font-size: 0.75rem;
            text-align: center;
            color: #aaaacf;
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 16px;
        }

        .emoji-big {
            font-size: 2rem;
            vertical-align: middle;
        }

        @media (max-width: 550px) {
            .question-text {
                font-size: 1.2rem;
            }
            .btn {
                padding: 10px 20px;
                font-size: 1.1rem;
            }
            .card {
                padding: 20px 16px;
            }
            .question-box {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="card">
        <h1>🎭 ПРАВДА <span style="color:#ff69b4;">ИЛИ</span> ДЕЙСТВИЕ</h1>
        <div class="sub">🔥 взрослая версия · 50+50 🔥</div>

        <div class="question-box" id="questionBox">
            <div class="question-text" id="questionText">
                Нажми «Правда» или «Действие»<br>🎲
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-truth" id="truthBtn">📖 ПРАВДА</button>
            <button class="btn btn-dare" id="dareBtn">⚡ ДЕЙСТВИЕ</button>
        </div>
        <div>
            <button class="btn btn-reset" id="resetBtn">🔄 Ещё раз (любой режим)</button>
        </div>
        <div class="footer">
            🃏 Игра для компании 18+ | 50 вопросов · 50 заданий | Случайный выбор
        </div>
    </div>
</div>

<script>
    // --------------------------- 50 ВОПРОСОВ (Правда) ---------------------------
    const truthList = [
        "Какой самый неловкий сексуальный опыт у тебя был?",
        "Ты когда-нибудь изменял/а партнёру? Если да, то почему?",
        "Какой у тебя самый странный фетиш?",
        "Расскажи о своих самых смелых фантазиях.",
        "Сколько у тебя было половых партнёров?",
        "Ты когда-нибудь пробовал/а что-то нетрадиционное в постели?",
        "Какой фильм или книга возбуждают тебя больше всего?",
        "Ты предпочитаешь доминировать или подчиняться?",
        "Было ли у тебя когда-нибудь свидание, которое закончилось сексом в тот же вечер?",
        "Какую позу ты считаешь самой недооценённой?",
        "Ты когда-нибудь отправлял/а откровенные фото? Кому?",
        "Что бы ты хотел/а попробовать, но ещё не решался/лась?",
        "Был ли у тебя опыт с человеком того же пола?",
        "Как часто ты мастурбируешь?",
        "Что тебя мгновенно заводит в партнёре?",
        "Ты когда-нибудь занимался/лась сексом в общественном месте? Где?",
        "Какой у тебя самый стыдливый секрет?",
        "Что бы ты изменил/а в своей сексуальной жизни?",
        "Ты предпочитаешь быстрый секс или долгие прелюдии?",
        "Смотрел/а ли ты порно в последнюю неделю? Какой жанр?",
        "Было ли у тебя когда-нибудь «разочарование» в постели? Что произошло?",
        "Какой комплимент тебе приятнее всего слышать во время секса?",
        "Ты когда-нибудь врал/а партнёру, что получил/а удовольствие?",
        "Что для тебя абсолютное табу в постели?",
        "Какая самая странная просьба приходила от партнёра?",
        "Ты предпочитаешь свет или темноту во время секса?",
        "Использовал/а ли ты когда-нибудь игрушки? Поделишься опытом?",
        "Что бы ты делал/а, если бы узнал/а, что у тебя осталось жить 24 часа?",
        "Какой поступок ты ни за что не простишь партнёру?",
        "Ты когда-нибудь ревновал/а без причины?",
        "Какую часть тела ты считаешь самой эрогенной у себя?",
        "Было ли у тебя свидание вслепую? Как оно прошло?",
        "Что ты скрываешь от своих родителей?",
        "Какую сумму ты готов/а отдать за ночь с известным человеком? С кем?",
        "Ты когда-нибудь хотел/а заняться сексом с другом/подругой?",
        "Что для тебя важнее: любовь или секс?",
        "Сколько времени обычно длится твой идеальный секс?",
        "Ты когда-нибудь засыпал/а во время секса?",
        "Что тебе нравится делать после секса?",
        "Как часто ты говоришь «я тебя люблю» без взаимности?",
        "Ты бы согласился/лась на секс втроём? С кем?",
        "Какой самый неприятный запах у партнёра для тебя?",
        "Ты предпочитаешь целоваться или заниматься оральным сексом?",
        "Что тебя больше заводит: голос, запах или прикосновения?",
        "Какое самое романтичное признание тебе делали?",
        "Ты когда-нибудь плакал/а после секса? Почему?",
        "Что бы ты хотел/а сделать на камеру?",
        "Какая у тебя самая большая неуверенность в постели?",
        "Ты бы решился/лась на секс в первый же день знакомства?",
        "Какой вопрос ты боишься услышать от партнёра?"
    ];

    // --------------------------- 50 ЗАДАНИЙ (Действие) ---------------------------
    const dareList = [
        "Сделай комплимент человеку слева от тебя, используя неприличный намёк.",
        "Изобрази, как ты соблазняешь воображаемого партнёра только с помощью взгляда.",
        "Расскажи самый короткий неприличный анекдот, который знаешь.",
        "Сымитируй стон удовольствия так громко, как можешь.",
        "Выбери одного игрока и расскажи, какую часть тела ты бы поцеловал/а у него первой.",
        "Танцуй эротический танец в течение 30 секунд под любую песню.",
        "Скажи фразу «Я хочу тебя» голосом робота.",
        "Покажи на одном из игроков место, где бы ты оставил/а засос.",
        "Завяжи глаза и угадай на ощупь три предмета, которые тебе дадут (безопасные).",
        "Попроси у соседа какой-нибудь предмет одежды и надень его на себя.",
        "Изобрази кошку, которая требует ласки, мяукая и потягиваясь.",
        "Скажи правду: если бы пришлось поцеловать кого-то из компании, кто бы это был?",
        "Сделай селфи с максимально «похотливым» выражением лица и покажи всем.",
        "Шепни на ухо игроку справа что-то грязное из трёх слов.",
        "Съешь банан самым соблазнительным способом (не отрывая глаз от любого игрока).",
        "Расскажи о случае, когда ты соврал/а, чтобы произвести впечатление.",
        "Напиши бывшему сообщение «Мне тебя не хватает» (можно без отправки, зачитать).",
        "Сыграй роль стриптизёра, снимая одну вещь (без полного раздевания).",
        "Придумай новое название для позы 69 и озвучь его.",
        "Покажи, как ты двигаешь бровями, чтобы пригласить кого-то в постель.",
        "Повтори три раза вслух: «Я сексуальный/ая и знаю это» с уверенностью.",
        "Изобрази, как ты пытаешься открыть бутылку вина, используя только бёдра.",
        "Сделай массаж плеч игроку слева не менее 20 секунд.",
        "Прочитай любое предложение из чата с интимной интонацией.",
        "Покажи на пальцах, сколько раз за последний месяц у тебя был секс (можно соврать).",
        "Поклянись, что выполнишь любое желание победителя следующего раунда (безопасное).",
        "При всех назови одну свою эрогенную зону и попроси соседа к ней прикоснуться.",
        "Создай «секс-плейлист» из трёх песен, которые включаешь в нужный момент.",
        "Изобрази, как ты снимаешь невидимые трусы через штаны.",
        "Скажи «Моё тело готово к приключениям» голосом диктора телепрограмм.",
        "Нарисуй в воздухе губами поцелуй и отправь самому старшему в компании.",
        "Попроси любого игрока придумать для тебя кличку на вечер, связанную с сексом.",
        "Встань и пройдись по комнате походкой, которая заводит тебя самого/саму.",
        "Сделай фото своей руки в «сердечке» и отправь в общий чат, если он есть.",
        "Расскажи одну вещь, которую ты никогда не делал/а, но хотел/а бы в постели.",
        "Придумай эротическое поздравление с днём рождения для невидимого именинника.",
        "Сымитируй, как ты застёгиваешь бюстгальтер одной рукой за спиной.",
        "Сделай голосом звук, похожий на вибратор, в течение 5 секунд.",
        "Покажи на одном из игроков, куда бы ты прикрепил/а наручники.",
        "Покрути бёдрами так, чтобы все зааплодировали.",
        "Прошепчи на ухо любому игроку комплимент его/её духам (или запаху).",
        "Изобрази, как ты проверяешь температуру воды локтём, но максимально сексуально.",
        "Скажи фразу «Только не останавливайся» с нарастающей страстью.",
        "Покажи, как ты надеваешь презерватив на банан (можно имитировать).",
        "Спроси у любого игрока, что ему нравится больше всего в твоей внешности.",
        "Придумай и скажи тост «За хороший секс и быстрый интернет».",
        "Сделай вид, что ты супермодель на подиуме, а трусики жмут.",
        "Покажи язык и проведи им по губам, глядя на самого застенчивого игрока.",
        "Скажи любому игроку: «Ты сегодня особенно вкусно пахнешь» и замри.",
        "Поклянись, что выполнишь любое одно желание всей компании (безопасное и выполнимое)."
    ];

    // Убедимся, что по 50 штук (на всякий случай выведем в консоль)
    console.assert(truthList.length === 50, "Вопросов не 50!");
    console.assert(dareList.length === 50, "Заданий не 50!");

    // DOM элементы
    const questionTextDiv = document.getElementById('questionText');
    const truthBtn = document.getElementById('truthBtn');
    const dareBtn = document.getElementById('dareBtn');
    const resetBtn = document.getElementById('resetBtn');

    // Функция получения случайного элемента из массива
    function getRandomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    // Показать правду
    function showTruth() {
        const randomTruth = getRandomItem(truthList);
        questionTextDiv.innerHTML = `📖 ПРАВДА:<br><span style="font-weight:normal; display:inline-block; margin-top:12px;">${randomTruth}</span>`;
    }

    // Показать действие
    function showDare() {
        const randomDare = getRandomItem(dareList);
        questionTextDiv.innerHTML = `⚡ ДЕЙСТВИЕ:<br><span style="font-weight:normal; display:inline-block; margin-top:12px;">${randomDare}</span>`;
    }

    // Ещё раз – выбираем случайно либо правду, либо действие, чтобы оживить игру
    // (по желанию пользователя: можно сделать "ещё раз" от последнего режима, но чаще интересно – пусть кидает случайный режим)
    function randomModeAgain() {
        const isTruth = Math.random() < 0.5;
        if (isTruth) {
            showTruth();
        } else {
            showDare();
        }
    }

    // Назначаем обработчики
    truthBtn.addEventListener('click', showTruth);
    dareBtn.addEventListener('click', showDare);
    resetBtn.addEventListener('click', randomModeAgain);

    // Эффект появления – красивый первый текст
    setTimeout(() => {
        questionTextDiv.style.opacity = '1';
    }, 50);
</script>
</body>
</html>
