<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Match-3 Камни</title>
  <style>
    body {
      margin: 0;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
      flex-direction: column;
    }
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 340px;
      margin-bottom: 8px;
    }
    #gold-display {
      background: #f0a500;
      padding: 4px 12px;
      border-radius: 12px;
      color: #000;
      font-weight: bold;
    }
    #boosters { display: flex; gap: 6px; }
    .booster-btn {
      background: #2d2d44;
      border: none;
      color: white;
      font-size: 18px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .booster-btn.active-booster {
      background: #e94560;
      box-shadow: 0 0 8px #e94560;
    }
    .booster-count {
      background: #f0a500;
      color: #000;
      border-radius: 50%;
      padding: 0 4px;
      font-size: 14px;
      margin-left: 2px;
    }
    canvas {
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      touch-action: none;
      background: #22223b;
    }
    #info {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 340px;
    }
    #level-bar {
      width: 200px;
      height: 14px;
      background: #333;
      border-radius: 7px;
      overflow: hidden;
    }
    #level-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f0a500, #f5d061);
      transition: width 0.3s;
    }
    #shop-btn, #close-shop {
      background: #e94560;
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    #shop-modal {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #22223b;
      padding: 20px;
      border-radius: 16px;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 0 30px rgba(0,0,0,0.7);
      z-index: 10;
    }
    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .buy-btn {
      background: #f0a500;
      border: none;
      color: black;
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="top-bar">
  <div id="gold-display">🪙 <span id="goldAmount">0</span></div>
  <div id="boosters">
    <button class="booster-btn" data-type="hammer">🔨 <span class="booster-count">0</span></button>
    <button class="booster-btn" data-type="cross">✚ <span class="booster-count">0</span></button>
    <button class="booster-btn" data-type="bomb">💣 <span class="booster-count">0</span></button>
    <button class="booster-btn" data-type="shuffle">🔀 <span class="booster-count">0</span></button>
  </div>
  <button id="shop-btn">🛒</button>
</div>

<canvas id="gameCanvas" width="320" height="320"></canvas>

<div id="info">
  <span id="levelDisplay">Ур. 1</span>
  <div id="level-bar"><div id="level-fill"></div></div>
  <span id="xpDisplay">0 XP</span>
</div>

<div id="shop-modal">
  <h3>Магазин</h3>
  <div class="shop-item"><span>🔨 Молоток (20 зол.)</span> <button class="buy-btn" data-item="hammer">Купить</button></div>
  <div class="shop-item"><span>✚ Крест (40 зол.)</span> <button class="buy-btn" data-item="cross">Купить</button></div>
  <div class="shop-item"><span>💣 Бомба (50 зол.)</span> <button class="buy-btn" data-item="bomb">Купить</button></div>
  <div class="shop-item"><span>🔀 Перемешивание (30 зол.)</span> <button class="buy-btn" data-item="shuffle">Купить</button></div>
  <div class="shop-item"><span>🪙 100 золота</span> <button class="buy-btn" id="buyGoldBtn">⭐ Купить за Stars</button></div>
  <button id="close-shop">Закрыть</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const ROWS = 8, COLS = 8, TILE = 40; // tile size
  const GEMS = ['💎','🔷','🔶','🟢','🟣','🔴']; // 6 камней
  const EMPTY = -1;

  // DOM кэш
  const goldSpan = document.getElementById('goldAmount');
  const lvlDisp = document.getElementById('levelDisplay');
  const xpDisp = document.getElementById('xpDisplay');
  const lvlFill = document.getElementById('level-fill');
  const shopModal = document.getElementById('shop-modal');
  const boosterBtns = document.querySelectorAll('.booster-btn');

  // Состояние
  let board, sel = null, lvl = 1, xp = 0, xpNext = 100, busy = false, gold = 100;
  const boost = { hammer:1, cross:1, bomb:1, shuffle:1 };
  let activeB = null;
  let activeGemCount = 4; // начальные виды камней

  // Анимации
  let anims = [], particles = [], loopId = null, pending = null, lastT = 0;

  function emptyBoard() { return Array(ROWS).fill().map(()=>Array(COLS).fill(EMPTY)); }
  function randGem() { return Math.floor(Math.random() * activeGemCount); }

  function updateDifficulty() {
    activeGemCount = Math.min(4 + Math.floor((lvl-1)/3), GEMS.length);
    xpNext = 100;
    for (let i=1; i<lvl; i++) {
      xpNext = Math.floor(xpNext * 1.5);
      if (i%3===0) xpNext = Math.floor(xpNext * 1.2);
    }
  }

  // Анимации: move, remove, appear
  function addMove(r1,c1,r2,c2,g,d=200) { anims.push({t:'move',r1,c1,r2,c2,g,p:0,d,st:performance.now()}); }
  function addRem(r,c,g,d=280) { anims.push({t:'rem',r,c,g,p:0,d,st:performance.now()}); }
  function addApp(r,c,g,d=220) { anims.push({t:'app',r,c,g,p:0,d,st:performance.now()}); }
  function spawnParts(r,c,gi) {
    const cx=c*TILE+20, cy=r*TILE+20, colors=['#ff0','#f0f','#0ff','#f00','#0f0','#00f'];
    for(let i=0;i<6;i++) {
      const a=Math.random()*6.28, s=0.8+Math.random()*2;
      particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:0.02+Math.random()*0.02,size:2+Math.random()*2,color:colors[gi%colors.length]});
    }
  }

  function startLoop() { if(!loopId){lastT=performance.now(); loopId=requestAnimationFrame(gameLoop);} }
  function stopLoop() { if(loopId){cancelAnimationFrame(loopId); loopId=null;} }
  function runThen(cb) { busy=true; pending=cb; startLoop(); }

  function gameLoop(now) {
    const dt=now-lastT; lastT=now;
    let done=true;
    for(let a of anims) if(a.p<1) { done=false; a.p=Math.min((now-a.st)/a.d,1); }
    for(let p of particles) { p.x+=p.vx*dt*0.06; p.y+=p.vy*dt*0.06; p.life-=p.decay*dt*0.06; }
    particles=particles.filter(p=>p.life>0);
    drawScene();
    if(!done||particles.length>0) loopId=requestAnimationFrame(gameLoop);
    else finishAnims();
  }

  function finishAnims() {
    const moves=anims.filter(a=>a.t==='move');
    for(let m of moves) { board[m.r2][m.c2]=m.g; if(board[m.r1][m.c1]===m.g) board[m.r1][m.c1]=EMPTY; }
    anims=[];
    stopLoop();
    if(pending) { const p=pending; pending=null; p(); }
    else { busy=false; updateUI(); drawScene(); }
  }

  // --- Отрисовка ---
  function drawStone(x,y,gem,scale=1,alpha=1) {
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.translate(x+20,y+20);
    ctx.scale(scale,scale);
    ctx.font='28px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(GEMS[gem],0,1);
    ctx.restore();
  }

  function drawScene() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
      if(board[r][c]===EMPTY) continue;
      let skip=anims.some(a=>(a.t==='move'&&a.r1===r&&a.c1===c&&a.p<1)||(a.t==='app'&&a.r===r&&a.c===c&&a.p<1));
      if(!skip) drawStone(c*TILE,r*TILE,board[r][c]);
    }
    for(let a of anims) {
      if(a.t==='move') {
        const fx=a.c1*TILE+20, fy=a.r1*TILE+20, tx=a.c2*TILE+20, ty=a.r2*TILE+20;
        const cx=fx+(tx-fx)*a.p, cy=fy+(ty-fy)*a.p;
        drawStone(cx-20,cy-20,a.g);
      } else if(a.t==='rem') {
        drawStone(a.c*TILE,a.r*TILE,a.g,1+a.p*0.3,1-a.p);
      } else if(a.t==='app') {
        drawStone(a.c*TILE,a.r*TILE,a.g,a.p);
      }
    }
    for(let p of particles) {
      ctx.save(); ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,6.28); ctx.fill(); ctx.restore();
    }
    if(sel && anims.length===0) {
      ctx.strokeStyle='#FFD700'; ctx.lineWidth=4;
      ctx.strokeRect(sel.c*TILE+2,sel.r*TILE+2,TILE-4,TILE-4);
    }
  }

  // --- Логика ---
  function fillBoard() {
    board=emptyBoard();
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) board[r][c]=randGem();
    removeAllMatches(true);
  }

  function findMatches() {
    const m=Array(ROWS).fill().map(()=>Array(COLS).fill(false));
    let f=false;
    for(let r=0;r<ROWS;r++) {
      for(let c=0;c<COLS-2;c++) {
        if(board[r][c]===EMPTY) continue;
        let len=1;
        while(c+len<COLS && board[r][c+len]===board[r][c]) len++;
        if(len>=3) { for(let i=0;i<len;i++) m[r][c+i]=true; f=true; c+=len-1; }
      }
    }
    for(let c=0;c<COLS;c++) {
      for(let r=0;r<ROWS-2;r++) {
        if(board[r][c]===EMPTY) continue;
        let len=1;
        while(r+len<ROWS && board[r+len][c]===board[r][c]) len++;
        if(len>=3) { for(let i=0;i<len;i++) m[r+i][c]=true; f=true; r+=len-1; }
      }
    }
    return {m,f};
  }

  function gravInstant() {
    for(let c=0;c<COLS;c++) {
      let w=ROWS-1;
      for(let r=ROWS-1;r>=0;r--) if(board[r][c]!==EMPTY) board[w--][c]=board[r][c];
      while(w>=0) board[w--][c]=randGem();
    }
  }

  function removeAllMatches(sil=false) {
    let total=0;
    while(true) {
      const {m,f}=findMatches();
      if(!f) break;
      for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(m[r][c]) { board[r][c]=EMPTY; total++; }
      gravInstant();
    }
    if(!sil) addXP(total*10);
    return total;
  }

  function removeAndGravity() {
    const {m,f}=findMatches();
    if(!f) { busy=false; updateUI(); drawScene(); return; }
    const rem=[];
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(m[r][c]) rem.push({r,c,g:board[r][c]});
    let cnt=0;
    for(let {r,c} of rem) { board[r][c]=EMPTY; cnt++; }
    addXP(cnt*10);
    gold+=Math.floor(cnt/3)*5;
    updateUI();
    rem.forEach(({r,c,g})=>{ addRem(r,c,g); spawnParts(r,c,g); });
    runThen(()=>applyGravityAnimated(()=>removeAndGravity()));
  }

  function applyGravityAnimated(cb) {
    const moves=[], news=[];
    for(let c=0;c<COLS;c++) {
      let w=ROWS-1;
      for(let r=ROWS-1;r>=0;r--) {
        if(board[r][c]!==EMPTY) {
          if(r!==w) { moves.push({r1:r,c1:c,r2:w,c2:c,g:board[r][c]}); board[r][c]=EMPTY; }
          w--;
        }
      }
      for(let r=w;r>=0;r--) { const ng=randGem(); board[r][c]=ng; news.push({r,c,g:ng}); }
    }
    if(!moves.length&&!news.length) return cb();
    moves.forEach(m=>addMove(m.r1,m.c1,m.r2,m.c2,m.g,150));
    news.forEach(t=>addApp(t.r,t.c,t.g,200));
    runThen(cb);
  }

  function trySwap(r1,c1,r2,c2) {
    const g1=board[r1][c1], g2=board[r2][c2];
    board[r1][c1]=EMPTY; board[r2][c2]=EMPTY;
    addMove(r1,c1,r2,c2,g1,180); addMove(r2,c2,r1,c1,g2,180);
    runThen(()=>{
      if(!findMatches().f) {
        board[r2][c2]=EMPTY; board[r1][c1]=EMPTY;
        addMove(r2,c2,r1,c1,g1,150); addMove(r1,c1,r2,c2,g2,150);
        runThen(()=>{ busy=false; updateUI(); drawScene(); });
      } else removeAndGravity();
    });
  }

  function handleClick(row,col) {
    if(busy||(board[row][col]===EMPTY && activeB!=='bomb'&&activeB!=='cross')) return;
    if(activeB) { if(useBooster(row,col)) updateUI(); return; }
    if(sel) {
      const {row:sr, col:sc}=sel;
      if(sr===row&&sc===col) { sel=null; drawScene(); return; }
      if(Math.abs(sr-row)+Math.abs(sc-col)===1) { sel=null; busy=true; trySwap(sr,sc,row,col); }
      else { sel={row,col}; drawScene(); }
    } else { sel={row,col}; drawScene(); }
  }

  function useBooster(row,col) {
    if(!activeB||boost[activeB]<=0) return false;
    if(activeB==='hammer' && board[row][col]!==EMPTY) {
      board[row][col]=EMPTY; boost.hammer--; deactB(); applyGravityAnimated(()=>removeAndGravity()); return true;
    }
    if(activeB==='cross' && board[row][col]!==EMPTY) {
      const aff=[];
      for(let r=0;r<ROWS;r++) if(board[r][col]!==EMPTY) { aff.push({r,c:col,g:board[r][col]}); board[r][col]=EMPTY; }
      for(let c=0;c<COLS;c++) if(board[row][c]!==EMPTY) { aff.push({r:row,c,g:board[row][c]}); board[row][c]=EMPTY; }
      // убираем дубликат центра
      if(aff.length) { boost.cross--; aff.forEach(a=>spawnParts(a.r,a.c,a.g)); deactB(); applyGravityAnimated(()=>removeAndGravity()); return true; }
    }
    if(activeB==='bomb') {
      const aff=[];
      for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) {
        const r=row+dr, c=col+dc;
        if(r>=0&&r<ROWS&&c>=0&&c<COLS&&board[r][c]!==EMPTY) { aff.push({r,c,g:board[r][c]}); board[r][c]=EMPTY; }
      }
      if(aff.length) { boost.bomb--; aff.forEach(a=>spawnParts(a.r,a.c,a.g)); deactB(); applyGravityAnimated(()=>removeAndGravity()); return true; }
    }
    if(activeB==='shuffle') {
      const tiles=[];
      for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(board[r][c]!==EMPTY) tiles.push(board[r][c]);
      tiles.sort(()=>Math.random()-0.5);
      let idx=0;
      for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(board[r][c]!==EMPTY) board[r][c]=tiles[idx++];
      boost.shuffle--; deactB(); removeAndGravity(); return true;
    }
    return false;
  }

  function deactB() { activeB=null; updateBoosterBtns(); }
  function actB(type) { if(boost[type]<=0) return; activeB=activeB===type?null:type; sel=null; updateBoosterBtns(); drawScene(); }
  function updateBoosterBtns() { boosterBtns.forEach(b=>b.classList.toggle('active-booster',b.dataset.type===activeB)); }

  function addXP(amount) {
    xp+=amount;
    while(xp>=xpNext) { xp-=xpNext; lvl++; updateDifficulty(); gold+=30; if(lvl%3===0) gold+=50; }
  }

  function updateUI() {
    lvlDisp.textContent=`Ур. ${lvl}`;
    xpDisp.textContent=`${xp}/${xpNext} XP`;
    lvlFill.style.width=`${(xp/xpNext)*100}%`;
    goldSpan.textContent=gold;
    document.querySelector('[data-type="hammer"] .booster-count').textContent=boost.hammer;
    document.querySelector('[data-type="cross"] .booster-count').textContent=boost.cross;
    document.querySelector('[data-type="bomb"] .booster-count').textContent=boost.bomb;
    document.querySelector('[data-type="shuffle"] .booster-count').textContent=boost.shuffle;
  }

  // Магазин
  function buyItem(item) {
    const prices={hammer:20,cross:40,bomb:50,shuffle:30};
    if(gold>=prices[item]) { gold-=prices[item]; boost[item]++; updateUI(); }
    else alert('Недостаточно золота!');
  }
  function buyGold() { gold+=100; updateUI(); alert('Тестовое начисление 100 золота!'); }

  function newGame() {
    board=emptyBoard();
    lvl=1; xp=0; updateDifficulty(); gold=100;
    boost.hammer=1; boost.cross=1; boost.bomb=1; boost.shuffle=1;
    sel=null; activeB=null; anims=[]; particles=[]; pending=null; busy=false;
    stopLoop(); fillBoard(); updateUI(); updateBoosterBtns(); drawScene();
  }

  // События
  canvas.addEventListener('click',e=>{
    const r=canvas.getBoundingClientRect();
    const sx=canvas.width/r.width, sy=canvas.height/r.height;
    const col=Math.floor((e.clientX-r.left)*sx/TILE), row=Math.floor((e.clientY-r.top)*sy/TILE);
    if(row>=0&&row<ROWS&&col>=0&&col<COLS) handleClick(row,col);
  });
  canvas.addEventListener('touchstart',e=>{
    e.preventDefault();
    const t=e.touches[0];
    const r=canvas.getBoundingClientRect();
    const sx=canvas.width/r.width, sy=canvas.height/r.height;
    const col=Math.floor((t.clientX-r.left)*sx/TILE), row=Math.floor((t.clientY-r.top)*sy/TILE);
    if(row>=0&&row<ROWS&&col>=0&&col<COLS) handleClick(row,col);
  },{passive:false});

  boosterBtns.forEach(b=>b.addEventListener('click',()=>actB(b.dataset.type)));
  document.getElementById('shop-btn').addEventListener('click',()=>shopModal.style.display='flex');
  document.getElementById('close-shop').addEventListener('click',()=>shopModal.style.display='none');
  shopModal.addEventListener('click',e=>{
    if(e.target.classList.contains('buy-btn')) {
      const item=e.target.dataset.item;
      if(item) buyItem(item); else if(e.target.id==='buyGoldBtn') buyGold();
    }
  });

  if(window.Telegram?.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); }
  newGame();
})();
</script>
</body>
</html>
