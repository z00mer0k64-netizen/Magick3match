        h1, h2 { margin: 0 0 16px; background: linear-gradient(135deg, #ff69b4, #87ceeb); -webkit-background-clip: text; background-clip: text; color: transparent; }
        input, select, button { background: #1e1e1e; border: 1px solid #ff69b4; padding: 10px 16px; border-radius: 40px; color: white; font-size: 1rem; margin: 5px 0; width: 100%; }
        button { background: #ff69b4; color: black; font-weight: bold; cursor: pointer; transition: 0.1s; }
        button:active { transform: scale(0.97); }
        .mode-card { display: inline-block; background: #2a2a2a; border-radius: 40px; padding: 8px 16px; margin: 4px; cursor: pointer; }
        .mode-card.selected { background: #ff69b4; color: black; }
        .players-list { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0; }
        .player-card { background: #1f1f2f; border-radius: 60px; padding: 8px 20px; border: 1px solid #87ceeb; }
        .player-card.active { background: #ff69b4; color: black; border-color: #fff; }
        .player-card.dead { opacity: 0.5; text-decoration: line-through; }
        .lives { color: #ff69b4; font-weight: bold; margin-left: 8px; }
        .question-box { background: #0a0a12; border-radius: 48px; padding: 28px; margin: 20px 0; text-align: center; border: 1px solid #ff69b4; }
        .game-buttons { display: flex; gap: 15px; justify-content: center; margin: 20px 0; }
        .fail-btn { background: #555; }

        .leaderboard-table th, .leaderboard-table td { padding: 8px; text-align: left; border-bottom: 1px solid #333; }

        .status { font-size: 0.9rem; margin-top: 10px; }

    <div id="lobbyScreen">

                <div id="modeSelector">
                    <div data-mode="all" class="mode-card selected">👨‍👩‍👧 Для всех</div>
                    <div data-mode="adult" class="mode-card">🍻 18+ (без секса)</div>
                    <div data-mode="couple" class="mode-card">🔥 Для пар</div>
                </div>
                <button id="createBtn">Создать комнату</button>
            </div>
            <div class="panel">
                <h2>🔗 Присоединиться</h2>

                <input type="text" id="roomIdInput" placeholder="Код комнаты">

            </div>
            <div class="panel">

            </div>
        </div>
        <div id="lobbyError" class="status" style="color:#ff88aa;"></div>
    </div>

    <!-- Экран игры -->
    <div id="gameScreen" class="hide">

            <div class="panel" style="flex:2">

                <div class="question-box">

                <div class="game-buttons">
                    <button id="truthBtn" class="truth-btn">📖 Правда</button>
                    <button id="dareBtn" class="dare-btn">⚡ Действие</button>
                    <button id="failBtn" class="fail-btn">❌ Не могу / Не знаю</button>
                </div>
                <div class="game-buttons">
                    <button id="nextTurnBtn">⏩ Следующий ход</button>
                </div>
                <div id="gameStatus" class="status"></div>
            </div>
            <div class="panel">
                <h2>🏆 Лидеры</h2>
                <div id="gameLeaderboards"></div>
            </div>
        </div>
        <button id="exitBtn" style="margin-top:20px;">🚪 Выйти в лобби</button>

</div>

    // ---------- РЕЖИМ ДЛЯ ПАР 18+ (ОЧЕНЬ ОТКРОВЕННЫЙ) ----------

        "Что бы сделал/а, застав партнёра за мастурбацией?",
        "Самая сексуальная часть тела партнёра?",
        "Засыпал/а во время секса?",
        "Что делать сразу после оргазма?",
        "Какой комплимент в постели заводит?",
        "Что боишься спросить у партнёра?",
        "Какую роль сыграть в постели?",
        "Самая стыдная случайность во время секса?",

        "Хочешь более инициативного или нежного?",
        "Что из запретного хотел/а бы попробовать?",
        "Как реагируешь на критику в постели?",
        "Виртуальный секс (видео/телефон)?",
        "Самый пошлый комплимент от партнёра?",
        "Что хочешь, чтобы партнёр сделал прямо сейчас?"
    ];
    const dareCouple = [
        "Прошепчи партнёру три грязные фразы.",
        "Изобрази соблазнение только взглядом и телом.",
        "Сымитируй стон удовольствия.",
        "Сделай эротический массаж шеи 30 сек.",
        "Скажи партнёру, какую его черту используешь в фантазиях.",
        "Покажи движение бёдрами как в позе наездницы.",
        "Напиши партнёру «Я хочу тебя сейчас» и покажи.",
        "Придумай три прозвища для гениталий партнёра.",
        "Расстегни одну вещь на партнёре зубами.",
        "Издай самый сексуальный звук, глядя в глаза.",
        "Завяжи глаза партнёру и проведи пальцем по телу.",
        "Шепни: «Сегодня я сделаю всё, что прикажешь».",

        "Лизни губы и скажи «Мне нравится то, что вижу».",
        "Назови маршрут поцелуев по телу партнёра.",
        "Покажи на своей руке, как хочешь, чтобы тебя трогали.",

        "Изобрази лицо оргазма без звука.",
        "Спроси партнёра, что он хочет сделать с тобой, и согласись.",

        "Погладь внутреннюю сторону бедра 10 секунд.",
        "Шепни: «Ты моё самое грязное желание».",
        "Изобрази надевание презерватива соблазнительно.",
        "Спроси, какую игрушку партнёр хочет, пообещай подарить.",
        "Сделай вид, что снимаешь партнёра для откровенного фото.",
        "Скажи три вещи, которые любишь в партнёре вне постели.",
        "Покажи на себе, куда партнёр должен поцеловать.",
        "Встань на колени и попроси прощения, что ещё не сделал этого.",
        "Придумай короткую пошлую считалочку.",
        "Сымитируй, как заводишь партнёра одним пальцем.",
        "Попроси разрешения поцеловать туда, куда редко целуют.",
        "Скажи: «Можешь делать со мной всё, что хочешь».",
        "Изобрази, как кончаешь от прикосновения.",
        "Придумай сексуальный псевдоним для партнёра.",
        "Покажи точку G (или аналог) серьёзно.",
        "Скажи комплимент запаху в интимной зоне.",
        "Покажи медленное движение бёдрами.",
        "Напиши записку «Сегодня я твой раб».",
        "Имитируй пробу на вкус.",
        "Покажи жест «иди сюда» пошло.",
        "Скажи, какую вещь сорвёшь первой, когда останетесь наедине.",
        "Поклянись выполнить следующее действие партнёра безоговорочно."
    ];

    // Объект для быстрого доступа
    const questionsDB = {
        all: truthAll,
        adult: truthAdult,
        couple: truthCouple
    };
    const dareDB = {
        all: dareAll,
        adult: dareAdult,
        couple: dareCouple
    };

    // ===================== ОСТАЛЬНАЯ ЛОГИКА (клиент) =====================
    const socket = io();
    let currentRoomId = null;
    let currentMode = 'all';
    let gameActive = false;
    let currentTurnPlayer = null;
    let playersMap = new Map();

    function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function renderPlayers() {
        const container = document.getElementById('playersList');
        container.innerHTML = '';
        playersMap.forEach((p, id) => {
            const div = document.createElement('div');
            div.className = `player-card ${currentTurnPlayer === p.name ? 'active' : ''} ${!p.isActive ? 'dead' : ''}`;
            div.innerHTML = `${p.name} <span class="lives">❤️ ${p.lives}</span>`;
            container.appendChild(div);
        });
    }

    function renderLeaderboards(data) {
        const html = (title, arr) => `
            <h3>${title}</h3>
            <table class="leaderboard-table"><tr><th>Игрок</th><th>Игр</th><th>Побед</th><th>%</th></tr>
            ${arr.map(p => `<tr><td>${p.name}</td><td>${p.games}</td><td>${p.wins}</td><td>${p.ratio}</td></tr>`).join('')}
            </table>`;
        const leaderDiv = document.getElementById('leaderboards');
        const gameLeaderDiv = document.getElementById('gameLeaderboards');
        if (leaderDiv) leaderDiv.innerHTML = html('🏅 По играм', data.byGames) + html('🏆 По победам', data.byWins) + html('📈 По винрейту', data.byRatio);
        if (gameLeaderDiv) gameLeaderDiv.innerHTML = html('🏅 По играм', data.byGames) + html('🏆 По победам', data.byWins) + html('📈 По винрейту', data.byRatio);
    }

    // Socket события
    socket.on('roomCreated', ({ roomId }) => {
        currentRoomId = roomId;
        document.getElementById('roomIdDisplay').innerText = roomId;
        document.getElementById('lobbyScreen').classList.add('hide');
        document.getElementById('gameScreen').classList.remove('hide');
        document.getElementById('modeDisplay').innerText = currentMode;
        gameActive = true;
    });

    socket.on('joinedRoom', ({ mode }) => {
        currentMode = mode;
        document.getElementById('modeDisplay').innerText = mode;
        document.getElementById('lobbyScreen').classList.add('hide');
        document.getElementById('gameScreen').classList.remove('hide');
        gameActive = true;
    });

    socket.on('roomState', ({ players, currentTurnIndex, winner }) => {
        playersMap.clear();
        players.forEach(p => { playersMap.set(p.id, { name: p.name, lives: p.lives, isActive: p.isActive }); });
        const playersArray = Array.from(playersMap.values());
        if (playersArray.length > 0) currentTurnPlayer = playersArray[currentTurnIndex]?.name;
        renderPlayers();
        if (winner) {
            document.getElementById('gameStatus').innerHTML = `🏆 Победитель: ${winner}! Игра завершена.`;
            gameActive = false;
        } else {
            document.getElementById('gameStatus').innerHTML = `Сейчас ходит: ${currentTurnPlayer}`;
        }
    });

    socket.on('turnChange', ({ playerName }) => {
        currentTurnPlayer = playerName;
        renderPlayers();
        document.getElementById('gameStatus').innerHTML = `Сейчас ходит: ${playerName}`;
        document.getElementById('questionText').innerHTML = 'Нажмите «Правда» или «Действие»';
    });

    socket.on('playerDied', ({ name }) => {
        alert(`💀 Игрок ${name} потерял все жизни и выбыл!`);
        renderPlayers();
    });

    socket.on('gameOver', ({ winner }) => {
        alert(`Игра окончена! Победитель: ${winner}`);
        gameActive = false;
    });

    socket.on('leaderboardUpdate', (data) => {
        renderLeaderboards(data);
    });

    socket.on('errorMessage', (msg) => {
        document.getElementById('lobbyError').innerText = msg;
        setTimeout(() => { document.getElementById('lobbyError').innerText = ''; }, 3000);
    });

    // Действия на кнопки
    document.getElementById('truthBtn')?.addEventListener('click', () => {
        if (!gameActive) return;
        const q = getRandomItem(questionsDB[currentMode]);
        document.getElementById('questionText').innerHTML = `📖 ПРАВДА:<br>${q}`;
    });
    document.getElementById('dareBtn')?.addEventListener('click', () => {
        if (!gameActive) return;
        const d = getRandomItem(dareDB[currentMode]);
        document.getElementById('questionText').innerHTML = `⚡ ДЕЙСТВИЕ:<br>${d}`;
    });
    document.getElementById('failBtn')?.addEventListener('click', () => {
        if (!gameActive) return;
        socket.emit('failTurn');
    });
    document.getElementById('nextTurnBtn')?.addEventListener('click', () => {
        if (!gameActive) return;
        socket.emit('nextTurnManually');
    });
    document.getElementById('exitBtn')?.addEventListener('click', () => {
        location.reload();
    });

    // Создание / присоединение
    document.getElementById('createBtn')?.addEventListener('click', () => {
        const name = document.getElementById('createName').value.trim();
        if (!name) { alert('Введите имя'); return; }
        const selected = document.querySelector('#modeSelector .mode-card.selected');
        currentMode = selected.getAttribute('data-mode');
        socket.emit('createRoom', { playerName: name, mode: currentMode });
    });
    document.getElementById('joinBtn')?.addEventListener('click', () => {
        const name = document.getElementById('joinName').value.trim();
        const roomId = document.getElementById('roomIdInput').value.trim();
        if (!name || !roomId) { alert('Введите имя и код комнаты'); return; }
        socket.emit('joinRoom', { roomId, playerName: name });
    });

    // Выбор режима визуально
    document.querySelectorAll('#modeSelector .mode-card').forEach(card => {
        card.addEventListener('click', () => {
            document.querySelectorAll('#modeSelector .mode-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
        });
    });
</script>
